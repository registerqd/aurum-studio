appId: studio.molda.app
productName: MOLDA Studio
copyright: Copyright © 2026 Aurum Studio contributors

directories:
  output: dist
  buildResources: build

# 关键：只将主进程和 preload 打入 asar，严格禁止打包任何根目录 node_modules！
files:
  - electron/**/*
  - package.json
  - "!node_modules/**"
  - "!node_modules"
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.md"

extraResources:
  - from: .next/standalone
    to: app-server
  - from: .next/static
    to: app-server/.next/static
  - from: public
    to: app-server/public
    filter:
      - "!showcase/**"

asar: true
compression: maximum
npmRebuild: false
nodeGypRebuild: false

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: MOLDA

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.graphics-design
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Graphics
  maintainer: Aurum Studio contributors
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
