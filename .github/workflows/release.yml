name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle (standalone)
        run: npm run build
        env:
          AURUM_ELECTRON: "1"

      - name: Prune bundle size
        shell: bash
        run: |
          echo "Pruning standalone bundle..."
          cd .next/standalone
          # 1. 移除所有 sourcemap
          find . -name "*.map" -type f -delete 2>/dev/null || true
          # 2. 移除所有 typescript 类型声明
          find . -name "*.d.ts" -type f -delete 2>/dev/null || true
          find . -name "*.tsbuildinfo" -type f -delete 2>/dev/null || true
          # 3. 移除 markdown 和测试文档
          find . -name "*.md" -type f -delete 2>/dev/null || true
          # 4. 移除多余平台的 SWC 编译器原生二进制
          cd ../..
          echo "Standalone pruned successfully"

      - name: Package desktop app
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurum-studio-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Generate Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
